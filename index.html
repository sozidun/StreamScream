<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбери эффект</title>
<!--
  СТРАНИЦА ДЛЯ ЗРИТЕЛЕЙ. В этом файле менять ничего не нужно:
    settings.js          - тексты, логотип, ссылки, поведение
    theme.css            - цвета, шрифты, размеры, фон, свечение
    catalog_public.json  - эффекты и цены (создаётся САМ при каждом сохранении catalog.txt)
  Все четыре файла должны лежать на сайте в одной папке.
-->
<link rel="stylesheet" href="theme.css">
<script src="settings.js"></script>
<script src="qr.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const S = (typeof SETTINGS !== 'undefined') ? SETTINGS : {};
const T = (k, d) => (S[k] !== undefined && S[k] !== null && S[k] !== '') ? S[k] : d;   // значение из settings.js или стандартное
const $ = id => document.getElementById(id);
const E = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? v[k] : m);
const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
let cfg = null, sel = null, sum = 100, CUR = '₽';

fetch('catalog_public.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { cfg = d; init(); })
  .catch(() => { const a = $('app'); a.appendChild(E('h1', '', 'Не удалось загрузить список эффектов')); a.appendChild(E('div', 'sub', 'Обновите страницу позже.')); });

function groups() {
  const all = [];
  cfg.instruments.forEach(i => i.effects.forEach(e => all.push({ i: i, e: e })));
  if (T('groupBy', 'instrument') === 'price') {
    const by = {};
    all.forEach(x => (by[x.e.min] = by[x.e.min] || []).push(x));
    return Object.keys(by).map(Number).sort((a, b) => a - b)
      .map(p => ({ head: fill(T('priceHeader', 'От {min} {cur}'), { min: p, cur: CUR }), items: by[p], full: true }));
  }
  return cfg.instruments.map(i => ({ head: i.icon + ' ' + i.name, full: false,
    items: i.effects.slice().sort((a, b) => a.min - b.min).map(e => ({ i: i, e: e })) }));
}

function init() {
  CUR = T('cur', cfg.cur || '₽');
  document.title = T('title', cfg.title);
  const bg = T('background', '');
  if (bg) document.documentElement.style.setProperty('--bg-image', "url('" + bg + "')");

  const app = $('app');
  const hero = E('div', 'hero');
  const logo = T('logo', '');
  if (logo) { const im = E('img', 'logo'); im.src = logo; im.alt = ''; hero.appendChild(im); }
  hero.appendChild(E('h1', '', T('title', cfg.title)));
  hero.appendChild(E('div', 'sub', T('subtitle', cfg.hint || '')));
  app.appendChild(hero);

  const prices = [];
  cfg.instruments.forEach(i => i.effects.forEach(e => prices.push(e.min)));
  sum = prices.length ? Math.max(1, Math.min.apply(null, prices)) : 100;

  // 1. имя и сумма
  const c1 = E('div', 'card'); c1.appendChild(E('h2', '', T('stepWho', '1. Кто ты и сколько')));
  const nm = E('input'); nm.id = 'nm'; nm.placeholder = T('namePlaceholder', 'Твой ник'); nm.maxLength = T('nameMaxLength', 30); nm.value = ls('nm');
  const sm = E('input'); sm.id = 'sum'; sm.type = 'number'; sm.min = 1; sm.value = sum; sm.style.marginTop = '8px';
  sm.oninput = () => { sum = Math.floor(Number(sm.value)) || 0; check(); };
  c1.append(nm, sm);
  const chips = E('div', 'chips');
  Array.from(new Set(prices)).sort((a, b) => a - b).forEach(p => {
    const b = E('button', 'chip', p + ' ' + CUR); b.onclick = () => { sum = p; sm.value = p; check(); }; chips.appendChild(b);
  });
  c1.appendChild(chips); app.appendChild(c1);

  // 2. эффекты (первая кнопка - «без эффекта», выбрана по умолчанию)
  const c2 = E('div', 'card'); c2.appendChild(E('h2', '', T('stepEffect', '2. Выбери эффект')));
  const none = E('button', 'fx none'); none.dataset.none = '1';
  const nl = E('span'); nl.appendChild(document.createTextNode(T('noEffectTitle', 'Без эффекта') + ' ')); nl.appendChild(E('small', '', T('noEffectHint', 'просто поддержать стрим')));
  none.appendChild(nl); none.onclick = () => { sel = null; check(); };
  c2.appendChild(none);
  c2.appendChild(E('div', 'hint', T('lockedHint', '')));
  groups().forEach(g => {
    c2.appendChild(E('div', 'gh', g.head));
    g.items.forEach(x => {
      const b = E('button', 'fx'); b.style.setProperty('--c', x.i.color); b.dataset.code = x.e.code; b.dataset.min = x.e.min;
      const l = E('span');
      l.appendChild(document.createTextNode((g.full ? x.i.icon + ' ' + x.i.name + ' — ' : '') + x.e.title + ' '));
      if (T('showDuration', true)) l.appendChild(E('small', '', x.e.dur + ' с'));
      b.append(l, E('span', 'price', 'от ' + x.e.min + ' ' + CUR));
      b.onclick = () => { if (b.classList.contains('lock')) return; sel = x; check(); };
      c2.appendChild(b);
    });
  });
  app.appendChild(c2);

  // 3. сообщение
  const c3 = E('div', 'card'); c3.appendChild(E('h2', '', T('stepMessage', '3. Сообщение (необязательно)')));
  const tx = E('textarea'); tx.id = 'tx'; tx.maxLength = cfg.maxText || 100; tx.placeholder = T('messagePlaceholder', 'Что хочешь сказать стримеру?');
  c3.appendChild(tx); app.appendChild(c3);

  const go = E('button'); go.id = 'go'; go.onclick = pay; app.appendChild(go);
  const pn = E('div', 'warn', T('prefillNote', '')); pn.id = 'pnote'; app.appendChild(pn);

  // подсказка про VPN, ссылка «оплатить с телефона» и плашка, которая появляется, если страница оплаты не открывается
  if (T('vpnHint', '')) app.appendChild(E('div', 'hint', T('vpnHint', '')));
  const hasQr = (typeof qrcode === 'function') && T('showQr', true);
  if (hasQr) { const ql = E('button', 'chip', T('qrLink', 'Оплатить с телефона (QR-код)')); ql.style.marginTop = '10px'; ql.onclick = showQr; app.appendChild(ql); }
  const vb = E('div', 'warn'); vb.id = 'vpn'; vb.style.display = 'none';
  vb.appendChild(E('b', '', T('vpnTitle', 'Не открывается страница оплаты?')));
  vb.appendChild(E('div', '', T('vpnText', 'Похоже, страница оплаты не открывается с твоего подключения. Чаще всего мешает VPN: выключи его на минуту (или выбери страну Россия) и нажми «Проверить снова».')));
  const vr = E('button', 'chip', T('vpnRecheck', 'Проверить снова')); vr.style.marginTop = '8px'; vr.onclick = vpnCheck; vb.appendChild(vr);
  app.appendChild(vb);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) vpnCheck(); });

  const links = T('links', []);
  if (links.length) { const w = E('div', 'links'); links.forEach(l => { const a = E('a', '', l.text); a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; w.appendChild(a); }); app.appendChild(w); }
  if (T('footer', '')) app.appendChild(E('div', 'foot', T('footer', '')));
  check();
  vpnCheck();
}

// текст, который зритель вставит в поле «Сообщение» на странице оплаты
function message() { return (sel ? '#' + sel.e.code + ' ' : '') + ($('tx').value || '').trim(); }

function check() {
  if (sel && sum < sel.e.min) sel = null;              // сумму уменьшили ниже цены - эффект снимается
  document.querySelectorAll('.fx').forEach(b => {
    if (b.dataset.none) { b.classList.toggle('sel', !sel); return; }
    b.classList.toggle('lock', sum < Number(b.dataset.min));
    b.classList.toggle('sel', !!sel && sel.e.code === b.dataset.code);
  });
  const go = $('go');
  go.disabled = !(sum >= 1) || !cfg.url;
  go.textContent = !(sum >= 1) ? T('buttonNoSum', 'Укажи сумму')
    : fill(sel ? T('buttonTextEffect', 'Поддержать на {sum} {cur} · {effect}') : T('buttonText', 'Поддержать на {sum} {cur}'),
           { sum: sum, cur: CUR, effect: sel ? sel.e.title : '' });
  $('pnote').style.display = (sel && T('prefill', false) && T('prefillNote', '')) ? 'block' : 'none';
}

// Ссылка на страницу оплаты. По умолчанию БЕЗ подстановки данных (надёжно для любого сервиса).
function payUrl() {
  if (!T('prefill', false)) return cfg.url;
  const enc = encodeURIComponent;
  return cfg.url + (cfg.url.indexOf('?') >= 0 ? '&' : '?') + cfg.pAmount + '=' + enc(sum) + '&' + cfg.pName + '=' + enc($('nm').value || '') + '&' + cfg.pMsg + '=' + enc(message());
}

function openPay() { if (T('openInNewTab', true)) window.open(payUrl(), '_blank'); else location.href = payUrl(); }

function copyMsg(btn) {
  let ok = true;
  try { navigator.clipboard.writeText(message()); } catch (e) { ok = false; }
  if (btn) btn.textContent = ok ? T('copied', 'Скопировано ✓') : 'Выдели текст и скопируй вручную';
}

function pay() {
  try { localStorage.setItem('nm', $('nm').value); } catch (e) {}
  if (T('copyMessage', true)) copyMsg(null);
  if (sel && !T('prefill', false)) showSteps(); else openPay();   // с подстановкой или без эффекта - сразу на страницу оплаты
}

// Окно с тремя шагами: что вставить и что ввести на странице оплаты
function showSteps() {
  closeSteps();
  const m = E('div', 'modal'); m.id = 'steps';
  const c = E('div', 'card');
  c.appendChild(E('h2', '', T('stepsTitle', 'Осталось 3 шага')));
  const ol = E('ol');
  ol.appendChild(E('li', '', T('step1', 'Нажми «Перейти к оплате» - откроется страница оплаты.')));
  const li2 = E('li', '', T('step2', 'В поле «Сообщение» вставь этот текст (Ctrl+V, на телефоне - долгое нажатие → Вставить):'));
  const box = E('div', 'msgbox', message()); li2.appendChild(box);
  const cp = E('button', 'chip', T('copyAgain', 'Скопировать сообщение')); cp.onclick = () => copyMsg(cp); li2.appendChild(cp);
  ol.appendChild(li2);
  ol.appendChild(E('li', '', fill(T('step3', 'Введи сумму {sum} {cur} и свой ник, нажми «Поддержать» на странице оплаты.'), { sum: sum, cur: CUR })));
  c.appendChild(ol);
  c.appendChild(E('div', 'hint', T('stepsNote', 'Если на странице оплаты уже что-то подставлено - проверь: сумма и сообщение должны быть такими, как здесь.')));
  const row = E('div', 'row');
  const g = E('button', '', T('goText', 'Перейти к оплате')); g.id = 'go2'; g.onclick = openPay;
  const x = E('button', 'chip', T('closeText', 'Назад')); x.onclick = closeSteps;
  row.append(g, x); c.appendChild(row); m.appendChild(c); document.body.appendChild(m);
}
function closeSteps() { const m = $('steps'); if (m) m.remove(); }

// Открывается ли страница оплаты с этого подключения (часто мешает VPN)? Проверка до нажатия «Поддержать».
function reachable() {
  let origin; try { origin = new URL(cfg.url).origin; } catch (e) { return Promise.resolve(true); }
  const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 6000);
  return fetch(origin + '/favicon.ico?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ac.signal })
    .then(() => true, () => false).then(ok => { clearTimeout(tm); return ok; });
}
function vpnCheck() {
  if (!T('vpnCheck', true) || !cfg || !cfg.url || !$('vpn')) return;
  reachable().then(ok => { $('vpn').style.display = ok ? 'none' : 'block'; });
}

// QR-код со ссылкой на оплату (чтобы оплатить с телефона, где VPN можно не включать)
function showQr() {
  closeSteps();
  const m = E('div', 'modal'); m.id = 'steps';
  const c = E('div', 'card');
  c.appendChild(E('h2', '', T('qrTitle', 'Оплата с телефона')));
  const q = qrcode(0, 'M'); q.addData(payUrl()); q.make();
  const box = E('div', 'qrbox'); box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });   // рисунок создаёт библиотека, текста зрителей в нём нет
  c.appendChild(box);
  c.appendChild(E('div', 'hint', T('qrText', 'Наведи камеру телефона на код: откроется страница оплаты с уже заполненными данными. Если страница не открывается, выключи VPN на телефоне.')));
  const row = E('div', 'row'); const x = E('button', 'chip', T('closeText', 'Назад')); x.onclick = closeSteps; row.appendChild(x);
  c.appendChild(row); m.appendChild(c); document.body.appendChild(m);
}
</script>
</body>
</html>
